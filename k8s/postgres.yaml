apiVersion: v1
kind: Secret
metadata:
  name: deskflow-secrets
  labels: {app: deskflow}
type: Opaque
stringData:
  POSTGRES_USER: deskflow
  POSTGRES_PASSWORD: deskflow
  POSTGRES_DB: deskflow
  DATABASE_URL: postgresql://deskflow:deskflow@db:5432/deskflow
  JWT_SECRET: change-me-demo-only
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  labels: {app: deskflow}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels: {app: deskflow, component: db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: deskflow, component: db}
  template:
    metadata:
      labels: {app: deskflow, component: db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          envFrom:
            - secretRef: {name: deskflow-secrets}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: db-data}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels: {app: deskflow, component: db}
spec:
  selector: {app: deskflow, component: db}
  ports: [{port: 5432, targetPort: 5432}]
