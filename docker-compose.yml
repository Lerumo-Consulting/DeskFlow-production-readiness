services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: deskflow
      POSTGRES_DB: deskflow
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskflow -d deskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://deskflow:deskflow@db:5432/deskflow
      JWT_SECRET: local-compose-secret-change-me
      JWT_EXPIRES_IN: 8h
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    # Apply database migrations, then start the API
    command: ["sh", "-c", "npx prisma migrate deploy && node src/server.js"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: