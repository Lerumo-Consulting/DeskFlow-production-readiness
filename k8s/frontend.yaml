apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: deskflow, component: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: deskflow, component: frontend}
  template:
    metadata:
      labels: {app: deskflow, component: frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/lerumo-consulting/deskflow-frontend:latest
          imagePullPolicy: Always
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app: deskflow, component: frontend}
spec:
  selector: {app: deskflow, component: frontend}
  ports: [{port: 80, targetPort: 80}]
